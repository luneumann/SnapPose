[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snappose"
version = "0.1.0"
description = "6D pose estimation of a known CAD part from a single RGB-D image"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "trimesh>=4.0", "opencv-python>=4.9", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
realsense = ["pyrealsense2"]

[project.scripts]
snappose = "snappose.cli:main"
snappose-gui = "snappose.gui.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"snappose.gui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
